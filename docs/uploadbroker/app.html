<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Broker · 上传台</title>
<style>
  :root{
    --bg:#0b0f17; --bg2:#0f1420; --card:#131a29; --card2:#182136;
    --line:#24304a; --line2:#31405f;
    --txt:#e8eefb; --dim:#8fa0bd; --dim2:#5d6d8c;
    --acc:#4f8cff; --acc2:#7c5cff; --grad:linear-gradient(135deg,#4f8cff,#7c5cff);
    --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --radius:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 500px at 85% -10%, #16223f 0%, transparent 60%),
      radial-gradient(900px 420px at -10% 110%, #1a1533 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}

  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:12px;flex:none;
    background:var(--grad);
    display:grid;place-items:center;
    box-shadow:0 8px 24px -8px rgba(90,110,255,.55);
  }
  .logo svg{width:26px;height:26px;fill:#fff}
  .brand h1{font-size:21px;font-weight:700;letter-spacing:.2px}
  .brand p{font-size:12.5px;color:var(--dim);margin-top:2px}
  .status-chip{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--dim);
    background:var(--card);border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none;
    transition:border-color .15s;
  }
  .status-chip:hover{border-color:var(--line2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7)}
  .dot.bad{background:var(--err);box-shadow:0 0 8px rgba(248,113,113,.7)}
  .dot.busy{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  .dropzone{
    border:2px dashed var(--line2);
    border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    padding:44px 20px 38px;
    text-align:center;cursor:pointer;
    transition:border-color .18s, background .18s, transform .12s;
    position:relative;overflow:hidden;
  }
  .dropzone:hover{border-color:var(--acc)}
  .dropzone.over{
    border-color:var(--acc2);
    background:rgba(90,110,255,.08);
    transform:scale(1.008);
  }
  .dz-ico{
    width:64px;height:64px;margin:0 auto 14px;border-radius:18px;
    background:var(--card2);border:1px solid var(--line2);
    display:grid;place-items:center;
  }
  .dz-ico svg{width:30px;height:30px;fill:var(--acc)}
  .dz-title{font-size:17px;font-weight:600}
  .dz-title em{font-style:normal;color:var(--acc)}
  .dz-sub{font-size:12.5px;color:var(--dim);margin-top:8px}
  .dz-hint{font-size:12px;color:var(--dim2);margin-top:16px}
  kbd{
    font-family:var(--mono);font-size:11px;
    background:var(--card2);border:1px solid var(--line2);border-bottom-width:2px;
    border-radius:6px;padding:1px 7px;color:var(--dim);
  }

  .panel{
    margin-top:18px;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;
  }
  .set-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    cursor:pointer;user-select:none;
  }
  .set-head h2{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.4px}
  .set-head .arrow{color:var(--dim2);transition:transform .18s;font-size:12px}
  .settings.open .set-head .arrow{transform:rotate(90deg)}
  .set-body{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .settings.open .set-body{display:block}
  .set-grid{display:grid;grid-template-columns:1fr 200px 200px;gap:12px}
  @media (max-width:640px){.set-grid{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  .field input,.field select{
    width:100%;background:var(--bg2);color:var(--txt);
    border:1px solid var(--line2);border-radius:9px;
    padding:8px 11px;font-size:13px;outline:none;
    transition:border-color .15s;
  }
  .field input:focus,.field select:focus{border-color:var(--acc)}
  .field input{font-family:var(--mono);font-size:12.5px}
  .field .tip{font-size:11px;color:var(--dim2);margin-top:5px}

  .queue{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .q-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12.5px;color:var(--dim);padding:0 2px;
  }
  .q-actions{display:flex;gap:8px;align-items:center}
  .q-actions button{
    background:none;border:1px solid var(--line2);color:var(--dim);
    font-size:12px;padding:3px 10px;border-radius:8px;cursor:pointer;
    transition:all .15s;
  }
  .q-actions button:hover{color:var(--txt);border-color:var(--acc)}

  .task{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;
    display:grid;grid-template-columns:44px 1fr auto;gap:13px;align-items:center;
  }
  .task.done{border-color:rgba(52,211,153,.35)}
  .task.error{border-color:rgba(248,113,113,.4)}
  .t-ico{
    width:44px;height:44px;border-radius:11px;flex:none;
    background:var(--card2);border:1px solid var(--line2);
    display:grid;place-items:center;overflow:hidden;
    position:relative;
  }
  .t-ico img{width:100%;height:100%;object-fit:cover;display:block}
  .t-ico svg{width:22px;height:22px;fill:var(--dim2)}
  .t-ico.err-svg svg{fill:var(--err)}
  .t-ico.ok-svg svg{fill:var(--ok)}
  .t-main{min-width:0}
  .t-name{
    font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .t-meta{font-size:11.5px;color:var(--dim2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
  .t-meta b{color:var(--dim);font-weight:600}
  .bar{
    height:5px;background:var(--bg2);border-radius:99px;margin-top:9px;overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0;border-radius:99px;background:var(--grad);
    transition:width .2s;
  }
  .t-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .t-pct{font:12px var(--mono);color:var(--dim)}
  .t-status{font-size:12px;font-weight:600}
  .t-status.up{color:var(--warn)}
  .t-status.ok{color:var(--ok)}
  .t-status.err{color:var(--err)}
  .t-err{font-size:11.5px;color:var(--err);margin-top:4px;max-width:520px}
  .btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .btns button{
    font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;
    background:var(--card2);border:1px solid var(--line2);color:var(--txt);
    transition:all .15s;white-space:nowrap;
  }
  .btns button:hover{border-color:var(--acc);background:#1b2742}
  .btns button.primary{background:var(--grad);border-color:transparent;font-weight:600}
  .btns button.primary:hover{filter:brightness(1.1)}
  .btns button.danger:hover{border-color:var(--err);color:var(--err)}
  .btns button:disabled{opacity:.45;cursor:not-allowed}

  .empty{
    text-align:center;color:var(--dim2);font-size:13px;
    padding:30px 0 22px;
  }

  footer{
    margin-top:34px;text-align:center;font-size:12px;color:var(--dim2);
    border-top:1px solid var(--line);padding-top:18px;
  }
  footer code{font-family:var(--mono);font-size:11px;background:var(--card2);padding:2px 6px;border-radius:5px}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
    background:#0d1424;border:1px solid var(--line2);
    color:var(--txt);font-size:13px;padding:10px 18px;border-radius:10px;
    box-shadow:0 12px 32px -8px rgba(0,0,0,.6);
    opacity:0;transition:all .25s;z-index:99;max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(248,113,113,.5)}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      </div>
      <div>
        <h1>Upload Broker · 上传台</h1>
        <p>拖拽文件，直传 UploadBroker 网关，秒得可消费的公开 URL</p>
      </div>
    </div>
    <div class="status-chip" id="health" title="点击检测服务状态">
      <span class="dot" id="health-dot"></span>
      <span id="health-txt">检测服务状态…</span>
    </div>
  </header>

  <section class="dropzone" id="dropzone">
    <div class="dz-ico">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
    </div>
    <div class="dz-title">将文件<em>拖拽到此处</em>，或<em>点击选择</em></div>
    <div class="dz-sub">支持 图片 · 音频 · 视频 · 文档，可多选批量上传</div>
    <div class="dz-hint">快捷键 <kbd>Ctrl</kbd> + <kbd>V</kbd> 也可直接粘贴截图上传</div>
  </section>

  <div class="panel settings" id="settings">
    <div class="set-head" id="set-head">
      <h2>⚙ 设置</h2>
      <span class="arrow">▶</span>
    </div>
    <div class="set-body">
      <div class="set-grid">
        <div class="field">
          <label>API 地址（域名）</label>
          <input id="api-base" type="text" spellcheck="false" placeholder="https://uploadbroker.dow-war.com">
          <div class="tip">上传请求发往 {地址}/v1/upload，请保证该域名已配置 CORS</div>
        </div>
        <div class="field">
          <label>有效期 TTL</label>
          <select id="ttl">
            <option value="">默认（服务端 default_ttl）</option>
            <option value="1">1 小时</option>
            <option value="2">2 小时</option>
            <option value="3">3 小时</option>
            <option value="6">6 小时</option>
            <option value="12">12 小时</option>
            <option value="24">24 小时</option>
          </select>
          <div class="tip">到达有效期后资源将被自动清理</div>
        </div>
        <div class="field">
          <label>并发上传数</label>
          <select id="concurrency">
            <option value="1">1 个</option>
            <option value="2">2 个</option>
            <option value="3" selected>3 个</option>
            <option value="5">5 个</option>
            <option value="8">8 个</option>
          </select>
          <div class="tip">同时进行中的上传任务数量</div>
        </div>
      </div>
    </div>
  </div>

  <section class="queue">
    <div class="q-head">
      <span id="q-count">上传队列（0）</span>
      <span class="q-actions">
        <button id="copy-all" title="复制全部成功 URL">复制全部 URL</button>
        <button id="clear-all" title="清空已完成/失败的任务">清空列表</button>
      </span>
    </div>
    <div id="task-list"></div>
  </section>

  <footer>
    <span>由 <a href="https://github.com/doc-war/uploadbroker" target="_blank" rel="noopener">UploadBroker</a> 驱动 · 临时存储，TTL 到期自动回收</span>
    <br><span style="margin-top:6px;display:inline-block">后端：<code>https://uploadbroker.dow-war.com</code></span>
  </footer>
</div>

<input type="file" id="picker" multiple hidden>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- 常量与配置 ---------- */
  var DEFAULT_API = "https://uploadbroker.dow-war.com";
  var CONCURRENCY = 3;
  var MAX = { image: 2*1024*1024, audio: 3*1024*1024, video: 10*1024*1024, document: 2*1024*1024 };
  var CATEGORY = {
    image: ["png","jpg","jpeg","webp"],
    audio: ["mp3","wav","m4a","aac"],
    video: ["mp4","webm"],
    document: ["txt","pdf"]
  };
  var ERR_MAP = {
    40001: "缺少文件（multipart 字段 file 为空）",
    40002: "空文件",
    40003: "不支持的格式（仅 png/jpeg/webp · mp3/wav/m4a/aac · mp4/webm · txt/pdf）",
    40004: "文件超过大小上限",
    40005: "TTL 无效（可选 1–24 小时）",
    40006: "扩展名与文件内容不符（MIME 魔数校验失败）",
    40401: "无效资源 URL",
    40402: "资源不存在或已过期",
    40500: "请求方法不被允许",
    50000: "服务内部错误",
    50001: "存储后端错误"
  };

  /* ---------- 状态 ---------- */
  var state = {
    apiBase: localStorage.getItem("ub_api") || DEFAULT_API,
    ttl: localStorage.getItem("ub_ttl") || "",
    concurrency: +(localStorage.getItem("ub_conc") || CONCURRENCY),
    tasks: [],          // 全部任务列表
    queued: [],         // 等待上传的任务 id
    running: 0,
    seq: 0
  };

  /* ---------- DOM ---------- */
  var $ = function(s){ return document.querySelector(s); };
  var list = $("#task-list");
  var picker = $("#picker");
  var dropzone = $("#dropzone");
  var toastTimer = null;

  /* ---------- 工具函数 ---------- */
  function fmtSize(n){
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n/1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n/1048576).toFixed(2) + " MB";
    return (n/1073741824).toFixed(2) + " GB";
  }
  function ext(name){
    var m = /\.([a-zA-Z0-9]+)$/.exec(name || "");
    return m ? m[1].toLowerCase() : "";
  }
  function categoryOf(file){
    var e = ext(file.name);
    for (var c in CATEGORY) if (CATEGORY[c].indexOf(e) !== -1) return c;
    return "document";
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg, isErr){
    var t = $("#toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = "toast"; }, 2600);
  }
  function copyText(s){
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("已复制"); }
      catch(e){ toast("复制失败，请手动复制", true); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function(){ toast("已复制"); }, fallback);
    } else fallback();
  }
  function mdFor(task){
    var url = task.result.url, name = task.file.name;
    return task.result.mimeType && task.result.mimeType.indexOf("image/") === 0
      ? "![" + name + "](" + url + ")"
      : "[" + name + "](" + url + ")";
  }

  /* ---------- 健康检查 ---------- */
  function checkHealth(){
    var dot = $("#health-dot"), txt = $("#health-txt");
    dot.className = "dot busy"; txt.textContent = "检测中…";
    var api = state.apiBase.replace(/\/$/, "");
    fetch(api + "/v1/health", { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.status === "ok") {
          dot.className = "dot ok";
          txt.textContent = "服务正常 · v" + (j.version || "?");
        } else {
          dot.className = "dot bad"; txt.textContent = "服务异常";
        }
      })
      .catch(function(){
        dot.className = "dot bad";
        txt.textContent = "连接失败（检查 CORS 是否已配置）";
      });
  }

  /* ---------- 任务渲染 ---------- */
  function iconFor(cat){
    var m = {
      image: '<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
      audio: '<svg viewBox="0 0 24 24"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3H9z"/></svg>',
      video: '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
      document: '<svg viewBox="0 0 24 24"><path d="M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>'
    };
    return m[cat] || m.document;
  }
  function iconForMime(mimeType){
    if (mimeType && mimeType.indexOf("image/") === 0) return "image";
    if (mimeType && mimeType.indexOf("audio/") === 0) return "audio";
    if (mimeType && mimeType.indexOf("video/") === 0) return "video";
    return "document";
  }
  function renderTask(t){
    var node = document.getElementById("task-" + t.id);
    if (!node) return;
    var pct = t.status === "done" ? 100 : t.status === "error" ? 0 : t.progress;

    if (t.status === "error") {
      node.className = "task error";
      node.querySelector(".t-ico").className = "t-ico err-svg";
      node.querySelector(".t-ico").innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';
      node.querySelector(".t-status").className = "t-status err";
      node.querySelector(".t-status").textContent = "失败";
      node.querySelector(".t-err").textContent = t.errMsg || "未知错误";
      node.querySelector(".bar i").style.width = "0%";
      node.querySelector(".t-pct").textContent = "—";
      node.querySelector(".btns").innerHTML =
        '<button data-act="retry">重试</button><button class="danger" data-act="del">移除</button>';
      return;
    }

    if (t.status === "done") {
      node.className = "task done";
      var ico = node.querySelector(".t-ico");
      ico.className = "t-ico";
      var ic = iconForMime(t.result.mimeType);
      if (ic === "image") {
        ico.innerHTML = '<img src="' + t.result.url + '" alt="" loading="lazy">';
      } else {
        ico.innerHTML = iconFor(ic);
      }
      node.querySelector(".t-status").className = "t-status ok";
      node.querySelector(".t-status").textContent = "✓ 已完成";
      node.querySelector(".t-meta").innerHTML =
        '<span><b>' + esc(t.result.mimeType) + '</b> · ' + fmtSize(t.result.size) + '</span>' +
        '<span>过期 <b>' + esc(t.result.expireAt || "—") + '</b></span>';
      node.querySelector(".bar i").style.width = "100%";
      node.querySelector(".t-pct").textContent = "100%";
      node.querySelector(".t-err").textContent = "";
      node.querySelector(".btns").innerHTML =
        '<button data-act="copy-url">复制 URL</button>' +
        '<button data-act="copy-md">复制 Markdown</button>' +
        '<button class="primary" data-act="open" title="新标签打开">打开 ↗</button>' +
        '<button class="danger" data-act="del">移除</button>';
      return;
    }

    /* pending / uploading */
    node.className = "task";
    var isUp = t.status === "uploading";
    node.querySelector(".t-ico").className = "t-ico";
    node.querySelector(".t-ico").innerHTML = iconFor(t.category);
    node.querySelector(".t-status").className = "t-status " + (isUp ? "up" : "");
    node.querySelector(".t-status").textContent = isUp ? "上传中…" : "排队中";
    node.querySelector(".bar i").style.width = pct + "%";
    node.querySelector(".t-pct").textContent = pct + "%";
    node.querySelector(".t-err").textContent = "";
    node.querySelector(".btns").innerHTML =
      '<button class="danger" data-act="cancel">取消</button>';
  }
  function addTask(file, oversized){
    var t = {
      id: "t" + (++state.seq),
      file: file,
      name: file.name,
      size: file.size,
      category: categoryOf(file),
      oversized: !!oversized,
      status: "pending",
      progress: 0,
      xhr: null,
      result: null,
      errMsg: ""
    };
    state.tasks.push(t);

    var li = document.createElement("div");
    li.className = "task";
    li.id = "task-" + t.id;
    li.innerHTML =
      '<div class="t-ico">' + iconFor(t.category) + '</div>' +
      '<div class="t-main">' +
        '<div class="t-name" title="' + esc(file.name) + '">' + esc(file.name) + '</div>' +
        '<div class="t-meta"><span>' + fmtSize(file.size) + '</span>' +
        (oversized ? '<span style="color:var(--warn)">⚠ 可能超限</span>' : '') +
        '</div>' +
        '<div class="bar"><i></i></div>' +
        '<div class="t-err"></div>' +
      '</div>' +
      '<div class="t-side">' +
        '<span class="t-pct">0%</span>' +
        '<span class="t-status">排队中</span>' +
        '<div class="btns"><button class="danger" data-act="cancel">取消</button></div>' +
      '</div>';
    list.appendChild(li);
    updateCount();
    return t;
  }

  function removeTask(id){
    state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
    state.queued = state.queued.filter(function(i){ return i !== id; });
    var node = document.getElementById("task-" + id);
    if (node) node.remove();
    updateCount();
  }

  function updateCount(){
    var ok = 0, total = state.tasks.length;
    state.tasks.forEach(function(t){ if (t.status === "done") ok++; });
    $("#q-count").textContent = "上传队列（成功 " + ok + " / 共 " + total + "）";
  }

  /* ---------- 上传调度 ---------- */
  function pump(){
    while (state.running < state.concurrency && state.queued.length) {
      var id = state.queued.shift();
      var t = state.tasks.find(function(x){ return x.id === id; });
      if (!t || t.status === "canceled") continue;
      state.running++;
      startUpload(t);
    }
  }

  function startUpload(t){
    t.status = "uploading";
    renderTask(t);

    var fd = new FormData();
    fd.append("file", t.file, t.name);
    if (state.ttl) fd.append("expires", state.ttl);

    var api = state.apiBase.replace(/\/$/, "") + "/v1/upload";
    var xhr = new XMLHttpRequest();
    t.xhr = xhr;
    xhr.open("POST", api);
    xhr.upload.onprogress = function(e){
      if (!e.lengthComputable) return;
      var p = Math.round(e.loaded / e.total * 100);
      t.progress = p;
      renderTask(t);
    };
    xhr.onerror = function(){
      t.status = "error";
      t.errMsg = "网络错误或浏览器跨域拦截：请确认 API 域名已为 /v1/* 配置 CORS 响应头（Access-Control-Allow-Origin），详见部署说明";
      state.running--;
      renderTask(t); updateCount(); pump();
    };
    xhr.ontimeout = function(){ xhr.onerror(); };
    xhr.onload = function(){
      state.running--;
      try {
        var j = JSON.parse(xhr.responseText);
        if (j.code === 0 && j.data && j.data.url) {
          t.status = "done";
          t.result = j.data;
        } else {
          t.status = "error";
          t.errMsg = (ERR_MAP[j.code] || ("服务端错误（code " + j.code + "）")) +
                     (j.msg ? "：" + j.msg : "");
        }
      } catch(e2){
        t.status = "error";
        t.errMsg = "响应解析失败：HTTP " + xhr.status + "（" + api + "）";
      }
      renderTask(t); updateCount(); pump();
    };
    xhr.send(fd);
    renderTask(t);
  }

  /* ---------- 添加文件 ---------- */
  function enqueueFiles(files){
    var arr = Array.prototype.slice.call(files || []);
    if (!arr.length) return;
    arr.forEach(function(f){
      var cat = categoryOf(f);
      var lim = MAX[cat] || MAX.document;
      var t = addTask(f, f.size > lim);
      state.queued.push(t.id);
    });
    pump();
  }

  function handleDrop(e){
    e.preventDefault();
    dropzone.classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files) enqueueFiles(e.dataTransfer.files);
  }

  function handlePaste(e){
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) {
      e.preventDefault();
      enqueueFiles(files);
    }
  }

  /* ---------- 事件绑定 ---------- */
  ["dragenter","dragover"].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); if (ev === "dragleave") dropzone.classList.remove("over"); });
  });
  dropzone.addEventListener("drop", handleDrop);
  dropzone.addEventListener("click", function(){ picker.click(); });
  picker.addEventListener("change", function(){ enqueueFiles(picker.files); picker.value = ""; });
  document.addEventListener("paste", handlePaste);

  /* 任务按钮：事件委托 */
  list.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if (!btn) return;
    var taskEl = btn.closest(".task");
    if (!taskEl) return;
    var id = taskEl.id.replace("task-", "");
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    var act = btn.getAttribute("data-act");
    switch (act) {
      case "copy-url":
        if (t.result) copyText(t.result.url);
        break;
      case "copy-md":
        if (t.result) copyText(mdFor(t));
        break;
      case "open":
        if (t.result) window.open(t.result.url, "_blank", "noopener");
        break;
      case "retry":
        if (t.status === "error") {
          state.queued.push(t.id);
          pump();
        }
        break;
      case "cancel":
        if (t.xhr) { try{ t.xhr.abort(); }catch(_){ } }
        if (t.status === "uploading") state.running--;
        removeTask(t.id);
        pump();
        break;
      case "del":
        removeTask(t.id);
        break;
    }
  });

  /* 设置 */
  $("#set-head").addEventListener("click", function(){
    $("#settings").classList.toggle("open");
  });
  ["api-base","ttl","concurrency"].forEach(function(k){
    $("#" + k).addEventListener("change", function(){
      if (k === "api-base") {
        state.apiBase = this.value.trim().replace(/\/+$/,"") || DEFAULT_API;
        localStorage.setItem("ub_api", state.apiBase);
        checkHealth();
      } else if (k === "ttl") {
        state.ttl = this.value;
        localStorage.setItem("ub_ttl", state.ttl);
      } else {
        state.concurrency = +this.value;
        localStorage.setItem("ub_conc", String(state.concurrency));
      }
    });
  });

  /* 复制全部 / 清空 */
  $("#copy-all").addEventListener("click", function(){
    var urls = state.tasks.filter(function(t){ return t.status === "done" && t.result; })
                          .map(function(t){ return t.result.url; });
    if (!urls.length) { toast("暂时没有已完成的文件", true); return; }
    copyText(urls.join("\n"));
  });
  $("#clear-all").addEventListener("click", function(){
    state.tasks.filter(function(t){
      return t.status === "done" || t.status === "error" || t.status === "canceled";
    }).forEach(function(t){ removeTask(t.id); });
  });

  /* 健康检查点击刷新 */
  $("#health").addEventListener("click", checkHealth);

  /* ---------- 初始化 ---------- */
  $("#api-base").value = state.apiBase;
  $("#ttl").value = state.ttl;
  $("#concurrency").value = String(state.concurrency);
  checkHealth();
})();
</script>
</body>
</html>
